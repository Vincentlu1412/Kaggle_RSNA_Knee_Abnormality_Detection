# RSNA Knee Abnormality Detection - Configuration
project:
  name: "rsna-knee-abnormality"
  competition: "rsna-knee-abnormality-detection"
  seed: 42

paths:
  data_root: "data/raw"
  processed_root: "data/processed"
  train_images: "train_images"
  test_images: "test_images"
  train_csv: "train.csv"
  test_csv: "test.csv"
  sample_submission: "sample_submission.csv"
  output_dir: "outputs"
  model_dir: "outputs/models"
  log_dir: "outputs/logs"
  submission_dir: "outputs/submissions"

data:
  image_size: [224, 224]
  batch_size: 32
  num_workers: 4
  train_split: 0.8
  val_split: 0.2
  stratify: true
  # Augmentation
  use_augmentation: true
  aug_prob: 0.5
  # Normalization (ImageNet stats)
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: "tf_efficientnet_b0_ns"  # timm model name
  pretrained: true
  num_classes: 3  # Normal, Abnormal, ACL tear (multi-label)
  drop_rate: 0.2
  drop_path_rate: 0.1

training:
  epochs: 30
  lr: 1e-4
  weight_decay: 1e-5
  optimizer: "adamw"
  scheduler: "cosine_warmup"
  warmup_epochs: 3
  min_lr: 1e-6
  # Loss
  loss: "bce_with_logits"  # Multi-label classification
  pos_weight: null  # Auto-calculate from data
  # Mixed precision
  use_amp: true
  # Gradient accumulation
  grad_accum_steps: 1
  # Early stopping
  early_stopping_patience: 7
  early_stopping_metric: "val_auc"
  # Checkpointing
  save_top_k: 3
  monitor: "val_auc"
  mode: "max"

inference:
  tta: true  # Test time augmentation
  tta_times: 4
  threshold: 0.5

logging:
  use_wandb: false
  wandb_project: "rsna-knee"
  log_interval: 50